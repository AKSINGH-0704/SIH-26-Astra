name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, integrity gate, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev,data]"

      - name: Lint
        run: ruff check apps/api scripts

      - name: Fixture integrity gate
        run: python scripts/validate_fixtures.py

      - name: Tests
        run: pytest
        working-directory: apps/api

      - name: OpenAPI schema is in sync with the committed contract
        run: |
          python scripts/export_openapi.py
          git diff --exit-code packages/contracts/openapi.json

  frontend:
    name: Frontend - types, lint, build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Generated types match the committed OpenAPI schema
        run: |
          npm run contracts
          git diff --exit-code packages/contracts/src/api.ts

      - name: Typecheck
        run: npm run typecheck:web

      - name: Lint
        run: npm run lint:web

      - name: Build
        run: npm run build:web
